<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>تصاميم ذيب</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="icon" type="image/jpeg" href="logo.jpeg" />
  <link rel="apple-touch-icon" href="logo.jpeg" />
  <!-- Arabic-friendly font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: "TS Block Bold";
      src: url("fonts/TS-Block-Bold.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Ethnocentric";
      src: url("fonts/Ethnocentric-Regular.otf") format("opentype");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #0a0a0a;
      --ink: #ffffff;
      --muted: #a0a0a0;
      --card: rgba(255, 255, 255, 0.06);
      --radius: 0px;
      --brand: #e63030;
      --brand-glow: rgba(230, 48, 48, 0.35);
    }

    html,
    body {
      margin: 0;
      padding: 0;
      color: var(--ink);
      background: var(--bg);
      overflow-x: hidden;
      overscroll-behavior-x: none;
      touch-action: pan-y;
      font-family: "TS Block Bold", "Cairo", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      line-height: 1.35;
      font-size: 18px;
    }

    body {
      padding-top: 0;
    }

    * {
      box-sizing: border-box;
    }

    /* ─── Top Bar (floating pill) ─── */
    .hero {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      width: min(1180px, 92%);
      margin: 0;
      background: transparent;
      border-bottom: 0;
    }
    .hide-hero {
      display: none !important;
    }

    .hero .wrap {
      max-width: none;
      padding: 0;
    }

    .bar {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .contact-bar {
      direction: ltr;
      justify-content: space-between;
      gap: 18px;
      padding: 14px 28px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, .07), rgba(255, 255, 255, .03) 46%, rgba(230, 48, 48, .06)),
        rgba(20, 20, 20, .75);
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 999px;
      backdrop-filter: blur(28px) saturate(145%);
      -webkit-backdrop-filter: blur(28px) saturate(145%);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 255, 255, .08), 0 0 42px rgba(230, 48, 48, .06);
    }

    .avatar {
      order: 3;
      width: 64px;
      height: 48px;
      border-radius: 8px;
      border: none;
      box-shadow: none;
      flex: 0 0 auto;
      margin-inline-end: 8px;
      object-fit: contain;
      cursor: pointer;
    }

    .site-brand {
      order: 2;
      margin-inline-start: auto;
      margin-inline-end: 2px;
      font-family: "Cairo", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      text-align: right;
    }

    .site-brand strong {
      display: block;
      color: #fff;
      font-size: 18px;
      line-height: 1.1;
      font-weight: 900;
    }

    .site-brand small {
      display: block;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      margin-top: 4px;
    }

    .contact {
      order: 1;
      direction: ltr;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-inline-start: 8px;
      margin-inline-end: 0;
    }

    /* ─── PWA Install Prompt ─── */
    .pwa-prompt {
      position: fixed;
      bottom: -100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 20, 20, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      border-radius: 999px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 99999;
      opacity: 0;
      pointer-events: none;
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    .pwa-prompt.show {
      bottom: 24px;
      opacity: 1;
      pointer-events: auto;
    }

    .pwa-prompt-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .pwa-prompt-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
      direction: rtl;
    }

    .pwa-prompt-text strong {
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      line-height: 1;
      font-family: "Cairo", sans-serif;
    }

    .pwa-prompt-text span {
      color: var(--muted);
      font-size: 11px;
      line-height: 1;
    }

    .pwa-prompt-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pwa-btn-install {
      background: var(--brand);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 999px;
      font-family: "Cairo", sans-serif;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 4px 15px var(--brand-glow);
      transition: 0.25s;
    }

    .pwa-btn-install:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(230, 48, 48, 0.6);
    }

    .pwa-btn-close {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 18px;
      cursor: pointer;
      transition: 0.25s;
    }

    .pwa-btn-close:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    @media (max-width: 600px) {
      .pwa-prompt {
        width: 90%;
        padding: 8px 12px;
        gap: 12px;
      }
      .pwa-prompt-icon {
        width: 38px;
        height: 38px;
      }
      .pwa-prompt-text strong {
        font-size: 13px;
      }
      .pwa-prompt-text span {
        font-size: 10px;
      }
    }

    .contact .c-item {
      position: relative;
      width: 40px;
      height: 40px;
      padding: 0;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, .06);
      border: 1px solid rgba(255, 255, 255, .12);
      transition: .25s;
    }

    .contact .c-item:hover {
      transform: translateY(-2px);
      background: linear-gradient(135deg, #25d366, #128c7e);
      box-shadow: 0 14px 34px rgba(37, 211, 102, .25);
    }

    .contact .c-item svg {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 17px;
      height: 17px;
      margin: 0;
      color: #25d366;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .contact .c-item:hover svg {
      color: #fff;
    }

    .contact .c-item a {
      position: absolute;
      inset: 0;
      overflow: hidden;
      white-space: nowrap;
      text-indent: 110%;
    }

    @media (max-width: 600px) {
      body {
        padding-top: 0;
      }

      .hero {
        top: 6px;
        width: 94%;
      }

      .contact-bar {
        min-height: 70px;
        padding: 12px 18px;
        border-radius: 999px;
      }

      .avatar {
        width: 50px;
        height: 36px;
        border-radius: 6px;
        margin-inline-end: 4px;
      }

      .site-brand strong {
        font-size: 15px;
      }

      .site-brand small {
        font-size: 11px;
      }

      .contact {
        gap: 8px;
        margin-inline-start: 4px;
      }

      .contact .c-item {
        width: 38px;
        height: 38px;
      }
    }

    /* ─── SECTIONS: Cinematic Backgrounds ─── */
    .gallery-root {
      padding: 0;
    }

    .cinema-section {
      position: relative;
      padding: 40px 12px 50px;
      margin-bottom: 0;
      overflow: hidden;
    }

    /* Provide extra space at the bottom for the overlap, unless it's identical or the very last section */
    .cinema-section:not(.no-bottom-seam):not(:last-of-type) {
      padding-bottom: 140px;
    }

    /* Smooth wide blend between different sections */
    .cinema-section + .cinema-section:not(.no-top-seam) {
      margin-top: -120px;
      padding-top: 160px;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 120px);
      mask-image: linear-gradient(to bottom, transparent 0%, black 120px);
    }

    .cinema-section::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      background: var(--sec-bg, #0a0a12) !important;
      opacity: 0.95;
      transition: background 0.4s ease;
    }

    .cinema-section.is-solid::before {
      opacity: 1 !important;
    }

    .whatsapp-footer.no-line::before {
      display: none !important;
    }

    .cinema-section > * {
      position: relative;
      z-index: 1;
    }

    /* ─── Package Style ─── */
    .package-header {
      max-width: 1400px;
      margin: 0 auto 24px;
      padding: 0 8px;
    }

    .package-header.align-right { text-align: right; }
    .package-header.align-left { text-align: left; }
    .package-header.align-center { text-align: center; }

    .section-title {
      margin: 0;
      color: #fff;
      font-weight: normal;
      font-size: clamp(22px, 5vw, 32px);
      font-family: "Ethnocentric", "TS Block Bold", "Cairo", sans-serif;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      letter-spacing: 0.5px;
    }

    .section-title-img {
      max-width: clamp(200px, 50vw, 500px);
      height: auto;
      max-height: 120px;
      object-fit: contain;
      filter: drop-shadow(0 6px 20px rgba(0, 0, 0, 0.5));
      border-radius: 8px;
    }

    @media (max-width: 600px) {
      .section-title-img {
        max-width: 70vw;
        max-height: 80px;
      }
    }

    /* ─── Dynamic Cards ─── */
    .dynamic-rows {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      gap: 10px;
    }

    .dynamic-row {
      display: grid;
      direction: ltr;
      gap: 8px;
      align-items: start;
      margin: 0;
      width: 100%;
      max-width: 100%;
    }

    .dynamic-cell {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      min-width: 0;
    }

    .dynamic-card {
      position: relative;
      width: 100%;
      margin: 0;
      aspect-ratio: var(--ratio, 1);
      border-radius: 0 !important;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow: hidden;
      cursor: zoom-in;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s ease;
    }

    .dynamic-card:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
    }

    .dynamic-card img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      border-radius: 0 !important;
      transition: opacity 0.4s ease;
    }

    .dynamic-label {
      align-self: flex-start;
      margin: 0 0 6px 2px;
      display: inline-block;
      font-size: 10px;
      font-weight: 800;
      line-height: 1.2;
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      padding: 4px 10px;
      pointer-events: none;
      font-family: "Cairo", sans-serif;
    }

    @media (max-width: 760px) {
      .dynamic-row {
        gap: 4px;
        max-width: 100% !important;
      }

      .dynamic-label {
        margin: 0 0 4px 2px;
        font-size: 9px;
        padding: 3px 7px;
      }

      .cinema-section {
        padding: 28px 8px 36px;
      }
      
      .cinema-section:not(.no-bottom-seam):not(:last-of-type) {
        padding-bottom: 110px;
      }

      .cinema-section + .cinema-section:not(.no-top-seam) {
        margin-top: -90px;
        padding-top: 118px;
        -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 90px);
        mask-image: linear-gradient(to bottom, transparent 0%, black 90px);
      }

      .package-header {
        padding: 0 4px;
      }
    }

    @media (max-width: 400px) {
      .cinema-section {
        padding: 22px 6px 28px;
      }

      .cinema-section:not(.no-bottom-seam):not(:last-of-type) {
        padding-bottom: 90px;
      }

      .cinema-section + .cinema-section:not(.no-top-seam) {
        margin-top: -70px;
        padding-top: 92px;
        -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 70px);
        mask-image: linear-gradient(to bottom, transparent 0%, black 70px);
      }

      :root {
        --radius: 12px;
      }
    }

    /* ─── Lightbox ─── */
    dialog#lightbox {
      border: none;
      padding: 0;
      background: transparent;
      overflow: hidden;
      scrollbar-width: none;
    }

    dialog#lightbox::-webkit-scrollbar,
    .lb-card::-webkit-scrollbar {
      display: none;
    }

    dialog#lightbox[open] {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: transparent;
      overflow: hidden;
      z-index: 1001;
    }

    .lb-backdrop {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
    }

    .lb-card {
      position: relative;
      width: auto;
      max-width: 90vw;
      max-height: 90vh;
      background: #111;
      border-radius: 16px;
      overflow: hidden;
      scrollbar-width: none;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .lb-img {
      display: block;
      width: auto;
      height: auto;
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      background: #111;
      margin: 0 auto;
      border-radius: 0;
    }

    .lb-bar {
      position: fixed;
      top: 14px;
      right: 16px;
      left: auto;
      z-index: 1002;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      padding: 0;
    }

    .lb-name {
      display: none;
    }

    #close {
      position: relative;
      width: 46px;
      height: 46px;
      padding: 0;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: transparent;
      font-size: 0;
      cursor: pointer;
      transition: 0.25s;
    }

    #close::before {
      content: "\00d7";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #fff;
      font-family: Arial, sans-serif;
      font-size: 28px;
      line-height: 1;
      font-weight: 400;
    }

    #close:hover {
      transform: scale(1.1);
      background: rgba(230, 48, 48, 0.3);
      border-color: rgba(230, 48, 48, 0.5);
    }

    @media (min-width: 900px) {
      .lb-card {
        max-width: 70vw;
      }

      .lb-img {
        max-width: 70vw;
      }
    }

    @media (min-width: 1600px) {
      .lb-card {
        max-width: 60vw;
      }

      .lb-img {
        max-width: 60vw;
      }
    }

    /* ─── WhatsApp Footer ─── */
    .whatsapp-footer {
      position: relative;
      padding: 52px 20px 40px;
      text-align: center;
      background:
        linear-gradient(180deg, transparent 0%, rgba(37, 211, 102, 0.04) 50%, transparent 100%);
    }

    .whatsapp-footer::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
    }

    .wa-title {
      font-family: "Ethnocentric", "TS Block Bold", "Cairo", sans-serif;
      font-size: clamp(14px, 3vw, 18px);
      color: var(--muted);
      margin-bottom: 20px;
      letter-spacing: 2px;
      font-weight: normal;
    }

    .wa-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 16px 36px;
      border-radius: 999px;
      background: linear-gradient(135deg, #25d366, #128c7e);
      color: #fff;
      text-decoration: none;
      font-family: "Cairo", sans-serif;
      font-weight: 800;
      font-size: 18px;
      box-shadow:
        0 20px 60px rgba(37, 211, 102, 0.25),
        0 0 80px rgba(37, 211, 102, 0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      direction: ltr;
    }

    .wa-btn:hover {
      transform: translateY(-4px) scale(1.03);
      box-shadow:
        0 28px 80px rgba(37, 211, 102, 0.35),
        0 0 100px rgba(37, 211, 102, 0.15);
    }

    .wa-btn svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    .wa-number {
      display: block;
      margin-top: 14px;
      color: rgba(255, 255, 255, 0.35);
      font-family: "Cairo", sans-serif;
      font-size: 13px;
      font-weight: 600;
      direction: ltr;
    }

    /* ─── Status ─── */
    .status {
      text-align: center;
      color: var(--muted);
      padding: 40px 10px;
      font-size: 14px;
    }

    .status:empty {
      display: none;
    }

    /* ─── Anti-screenshot styles ─── */
    img {
      -webkit-user-drag: none;
      user-drag: none;
      -webkit-touch-callout: none;
      user-select: none;
    }

    .anti-ss-on dialog#lightbox .lb-card {
      background: #0a0a0a !important;
    }

    .anti-ss-on .lb-img {
      opacity: 0 !important;
      background: #0a0a0a !important;
    }

    /* ─── Cinematic color presets ─── */
    .cinema-bg-red::before { background: linear-gradient(135deg, #1a0505 0%, #3d0a0a 30%, #5c1010 60%, #1a0505 100%); }
    .cinema-bg-blue::before { background: linear-gradient(135deg, #050a1a 0%, #0a1a3d 30%, #10285c 60%, #050a1a 100%); }
    .cinema-bg-purple::before { background: linear-gradient(135deg, #0f051a 0%, #200a3d 30%, #35105c 60%, #0f051a 100%); }
    .cinema-bg-green::before { background: linear-gradient(135deg, #051a0a 0%, #0a3d15 30%, #105c22 60%, #051a0a 100%); }
    .cinema-bg-orange::before { background: linear-gradient(135deg, #1a0f05 0%, #3d200a 30%, #5c3510 60%, #1a0f05 100%); }
    .cinema-bg-pink::before { background: linear-gradient(135deg, #1a0510 0%, #3d0a20 30%, #5c1035 60%, #1a0510 100%); }
    .cinema-bg-cyan::before { background: linear-gradient(135deg, #051a1a 0%, #0a3d3d 30%, #105c5c 60%, #051a1a 100%); }
    .cinema-bg-gold::before { background: linear-gradient(135deg, #1a1505 0%, #3d2f0a 30%, #5c4810 60%, #1a1505 100%); }
    .cinema-bg-dark::before { background: linear-gradient(135deg, #0a0a0a 0%, #151515 30%, #1a1a1a 60%, #0a0a0a 100%); }
    .cinema-bg-default::before { background: linear-gradient(135deg, #0a0a12 0%, #12122a 30%, #1a1a3a 60%, #0a0a12 100%); }

    /* Custom color via CSS variable */
    .cinema-bg-custom::before {
      background: var(--custom-bg, linear-gradient(
        135deg,
        color-mix(in oklab, var(--section-color, #e63030) 12%, #0a0a0a) 0%,
        color-mix(in oklab, var(--section-color, #e63030) 25%, #0a0a0a) 30%,
        color-mix(in oklab, var(--section-color, #e63030) 35%, #0a0a0a) 60%,
        color-mix(in oklab, var(--section-color, #e63030) 12%, #0a0a0a) 100%
      )) !important;
    }

    /* Pattern Overlay */
    .cinema-pattern {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0.5;
      -webkit-mask-image: linear-gradient(to bottom, black 0%, black calc(100% - 140px), transparent 100%);
      mask-image: linear-gradient(to bottom, black 0%, black calc(100% - 140px), transparent 100%);
    }
    .cinema-pattern.pattern-grid {
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .cinema-pattern.pattern-dots {
      background-image: radial-gradient(rgba(255, 255, 255, 0.14) 1.5px, transparent 1.5px);
      background-size: 18px 18px;
    }
    .cinema-pattern.pattern-diagonal {
      background-image: repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.06) 0, rgba(255, 255, 255, 0.06) 2px, transparent 0, transparent 12px);
    }
    .cinema-pattern.pattern-carbon {
      background-image:
        linear-gradient(27deg, rgba(0, 0, 0, 0.5) 5px, transparent 5px),
        linear-gradient(207deg, rgba(0, 0, 0, 0.5) 5px, transparent 5px),
        linear-gradient(117deg, rgba(255, 255, 255, 0.06) 5px, transparent 5px),
        linear-gradient(297deg, rgba(255, 255, 255, 0.06) 5px, transparent 5px);
      background-size: 16px 16px;
    }
    .cinema-pattern.pattern-waves {
      background-image: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.08) 20%, transparent 20%), radial-gradient(circle at 0 0, rgba(255, 255, 255, 0.06) 20%, transparent 20%);
      background-size: 30px 30px;
    }



    /* ─── Global Full-Page Loader ─── */
    .global-loader-overlay {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .global-loader-overlay.hidden {
      display: none;
    }
    
    /* Stop heavy box-shadow repaints instantly to allow smooth fade out */
    .global-loader-overlay.hidden .loader,
    .global-loader-overlay.hidden .loader:before,
    .global-loader-overlay.hidden .loader:after {
      animation: none !important;
    }
    
    .loader {
      --color-1: #fff;
      --color-2: #FF0000;
      --size: 4px;
      transform: rotateZ(45deg);
      perspective: calc(1000 * var(--size));
      border-radius: 50%;
      width: calc(48 * var(--size));
      height: calc(48 * var(--size));
      color: var(--color-1);
    }
    .loader:before,
    .loader:after {
      content: '';
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: inherit;
      height: inherit;
      border-radius: 50%;
      transform: rotateX(70deg);
      animation: 1s spin linear infinite;
    }
    .loader:after {
      color: var(--color-2);
      transform: rotateY(70deg);
      animation-delay: -0.6s;
    }

    @keyframes rotate {
      0% { transform: translate(-50%, -50%) rotateZ(0deg); }
      100% { transform: translate(-50%, -50%) rotateZ(360deg); }
    }

    @keyframes rotateccw {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(-360deg); }
    }

    @keyframes spin {
      0%, 100% { box-shadow: 0.2em 0 0 0 currentcolor; }
      12% { box-shadow: 0.2em 0.2em 0 0 currentcolor; }
      25% { box-shadow: 0 0.2em 0 0 currentcolor; }
      37% { box-shadow: -0.2em 0.2em 0 0 currentcolor; }
      50% { box-shadow: -0.2em 0 0 0 currentcolor; }
      62% { box-shadow: -0.2em -0.2em 0 0 currentcolor; }
      75% { box-shadow: 0 -0.2em 0 0 currentcolor; }
      87% { box-shadow: 0.2em -0.2em 0 0 currentcolor; }
    }
  </style>

  <script>
    const GALLERY_API_BASE = (window.deep_API_BASE || "https://deep.laithfree1.workers.dev").replace(/\/+$/, "");
    const galleryRoot = document.getElementById('dynamicGalleryRoot');
    const galleryStatus = document.getElementById('dynamicGalleryStatus');
    const lb = document.getElementById('lightbox');
    const backdrop = document.getElementById('backdrop');
    const lbImg = document.getElementById('lb-img');
    const lbName = document.getElementById('lb-name');
    const closeBtn = document.getElementById('close');

    // Cinematic color presets
    const COLOR_PRESETS = {
      '#e63030': 'red', '#cc0000': 'red', '#ff3333': 'red',
      '#2255cc': 'blue', '#1a44aa': 'blue', '#3366dd': 'blue',
      '#7733cc': 'purple', '#6622aa': 'purple', '#8844dd': 'purple',
      '#22aa44': 'green', '#119933': 'green', '#33bb55': 'green',
      '#dd7711': 'orange', '#cc6600': 'orange', '#ee8822': 'orange',
      '#dd2266': 'pink', '#cc1155': 'pink', '#ee3377': 'pink',
      '#11aaaa': 'cyan', '#009999': 'cyan', '#22bbbb': 'cyan',
      '#ccaa22': 'gold', '#bb9911': 'gold', '#ddbb33': 'gold',
      '#222222': 'dark', '#111111': 'dark', '#333333': 'dark',
    };

    function getCinemaClass(color) {
      if (!color) return 'cinema-bg-default';
      const lower = color.toLowerCase().trim();
      // Check named presets
      if (COLOR_PRESETS[lower]) return 'cinema-bg-' + COLOR_PRESETS[lower];
      // Check named colors
      const named = ['red', 'blue', 'purple', 'green', 'orange', 'pink', 'cyan', 'gold', 'dark'];
      if (named.includes(lower)) return 'cinema-bg-' + lower;
      // Custom color
      return 'cinema-bg-custom';
    }

    function setGalleryStatus(message) { if (galleryStatus) galleryStatus.textContent = message; }
    function rowNumber(item) { const row = Math.floor(Number(item && item.row)); return Number.isFinite(row) && row > 0 ? row : 1; }
    function itemRatio(item) { const ratio = Number(item && item.aspectRatio); return Number.isFinite(ratio) && ratio > 0 ? Math.min(Math.max(ratio, .25), 4) : 1; }
    function sortByOrder(items) { return items.slice().sort((a, b) => { const ar = rowNumber(a); const br = rowNumber(b); if (ar !== br) return ar - br; const ao = Number.isFinite(Number(a.order)) ? Number(a.order) : 0; const bo = Number.isFinite(Number(b.order)) ? Number(b.order) : 0; if (ao !== bo) return ao - bo; return String(a.createdAt || '').localeCompare(String(b.createdAt || '')); }); }
    function orderedSections(gallery) { const sections = gallery && gallery.sections && typeof gallery.sections === 'object' ? gallery.sections : {}; const order = Array.isArray(gallery && gallery.sectionOrder) ? gallery.sectionOrder : Object.keys(sections); const output = []; for (const id of order) { if (sections[id]) output.push(sections[id]); } for (const [id, section] of Object.entries(sections)) { if (!order.includes(id)) output.push(section); } return sortByOrder(output); }
    function groupedRows(items) { const rows = new Map(); for (const item of items) { const row = rowNumber(item); if (!rows.has(row)) rows.set(row, []); rows.get(row).push(item); } return Array.from(rows.entries()).sort((a, b) => a[0] - b[0]).map((entry) => entry[1]); }

    function computeSectionBgCss(section) {
      if (!section) return '#0a0a0a';
      const bgType = section.bgType || 'cinema';
      const color1 = section.bgColor || '';
      const color2 = section.bgColor2 || '#0a0a12';
      const gradDir = section.bgGradDir || '135deg';

      if (bgType === 'solid') {
        return color1 || '#1a1a3a';
      } else if (bgType === 'gradient') {
        const c1 = color1 || '#e63030';
        const c2 = color2 || '#0a0a12';
        return gradDir === 'radial'
          ? `radial-gradient(circle at center, ${c1} 0%, ${c2} 100%)`
          : `linear-gradient(${gradDir}, ${c1} 0%, ${c2} 100%)`;
      } else {
        const lower = (color1 || '').toLowerCase().trim();
        if (lower === 'red' || lower === '#e63030' || lower === '#cc0000') {
          return 'linear-gradient(135deg, #1a0505 0%, #3d0a0a 30%, #5c1010 60%, #1a0505 100%)';
        } else if (lower === 'blue' || lower === '#2255cc') {
          return 'linear-gradient(135deg, #050a1a 0%, #0a1a3d 30%, #10285c 60%, #050a1a 100%)';
        } else if (lower === 'purple' || lower === '#7733cc') {
          return 'linear-gradient(135deg, #0f051a 0%, #200a3d 30%, #35105c 60%, #0f051a 100%)';
        } else if (lower === 'green' || lower === '#22aa44') {
          return 'linear-gradient(135deg, #051a0a 0%, #0a3d15 30%, #105c22 60%, #051a0a 100%)';
        } else if (lower === 'orange' || lower === '#dd7711') {
          return 'linear-gradient(135deg, #1a0f05 0%, #3d200a 30%, #5c3510 60%, #1a0f05 100%)';
        } else if (lower === 'pink' || lower === '#dd2266') {
          return 'linear-gradient(135deg, #1a0510 0%, #3d0a20 30%, #5c1035 60%, #1a0510 100%)';
        } else if (lower === 'cyan' || lower === '#11aaaa') {
          return 'linear-gradient(135deg, #051a1a 0%, #0a3d3d 30%, #105c5c 60%, #051a1a 100%)';
        } else if (lower === 'gold' || lower === '#ccaa22') {
          return 'linear-gradient(135deg, #1a1505 0%, #3d2f0a 30%, #5c4810 60%, #1a1505 100%)';
        } else if (lower === 'dark' || lower === '#222222') {
          return 'linear-gradient(135deg, #0a0a0a 0%, #151515 30%, #1a1a1a 60%, #0a0a0a 100%)';
        } else if (color1 && color1.startsWith('#')) {
          return `linear-gradient(135deg, color-mix(in oklab, ${color1} 15%, #0a0a0a) 0%, color-mix(in oklab, ${color1} 35%, #0a0a0a) 50%, color-mix(in oklab, ${color1} 15%, #0a0a0a) 100%)`;
        } else {
          return 'linear-gradient(135deg, #0a0a12 0%, #12122a 30%, #1a1a3a 60%, #0a0a12 100%)';
        }
      }
    }

    function applySectionBackground(sectionEl, section) {
      const bgCss = computeSectionBgCss(section);
      sectionEl.style.setProperty('--sec-bg', bgCss);

      const pattern = section.bgPattern || 'none';
      let patternEl = sectionEl.querySelector('.cinema-pattern');
      if (pattern && pattern !== 'none') {
        if (!patternEl) {
          patternEl = document.createElement('div');
          sectionEl.insertBefore(patternEl, sectionEl.firstChild);
        }
        patternEl.className = 'cinema-pattern pattern-' + pattern;
      } else if (patternEl) {
        patternEl.remove();
      }
    }

    function renderGallery(gallery) {
      const settings = (gallery && gallery.settings) || {};
      if (settings.siteLogo) {
        const logoEl = document.getElementById('topBarLogo');
        if (logoEl) logoEl.src = settings.siteLogo;
      }
      if (settings.whatsapp) {
        const waBtn = document.querySelector('.wa-btn');
        const cleanNum = String(settings.whatsapp).replace(/[^\d+]/g, '');
        if (waBtn && cleanNum) waBtn.href = 'https://wa.me/' + cleanNum.replace(/^\+/, '');
      }

      const sections = orderedSections(gallery);
      const activeSections = sections.filter(s => {
        const items = Object.values(s.items || {}).filter(item => item && item.imageUrl);
        return items.length > 0;
      });
      const firstSection = activeSections[0];
      const lastSection = activeSections[activeSections.length - 1];

      galleryRoot.innerHTML = '';
      galleryRoot.appendChild(galleryStatus);

      if (!sections.length) {
        setGalleryStatus('\u0644\u0627 \u062a\u0648\u062c\u062f \u0623\u0642\u0633\u0627\u0645 \u062d\u0627\u0644\u064a\u0627.');
        return;
      }
      setGalleryStatus('');

      let prevSectionEl = null;
      let prevBgCss = null;
      const renderedSectionEls = [];

      for (const section of sections) {
        const items = sortByOrder(Object.values(section.items || {}).filter(item => item && item.imageUrl));
        if (!items.length) continue;

        const sectionEl = document.createElement('section');
        sectionEl.className = 'cinema-section';
        applySectionBackground(sectionEl, section);

        const bgCss = computeSectionBgCss(section);
        const bgType = section.bgType || 'cinema';

        if (bgType === 'solid') {
          sectionEl.classList.add('no-vignette');
          sectionEl.classList.add('is-solid');
        }

        if (prevSectionEl && prevBgCss === bgCss) {
          prevSectionEl.classList.add('no-bottom-seam');
          sectionEl.classList.add('no-top-seam');
        }

        prevSectionEl = sectionEl;
        prevBgCss = bgCss;
        renderedSectionEls.push(sectionEl);



        // Package header
        const header = document.createElement('div');
        const align = section.titleAlign || 'right';
        header.className = 'package-header align-' + align;

        // Render Title Image FIRST if available (IMAGE ABOVE TITLE TEXT)
        if (section.titleImage) {
          const titleImg = document.createElement('img');
          titleImg.className = 'section-title-img';
          titleImg.src = section.titleImage;
          titleImg.alt = section.title || 'قسم';
          titleImg.loading = 'lazy';
          titleImg.style.display = 'block';
          if (align === 'center') titleImg.style.margin = '0 auto 8px';
          else if (align === 'left') titleImg.style.margin = '0 0 8px 0';
          else titleImg.style.margin = '0 0 8px auto';
          header.appendChild(titleImg);
        }

        // Render Title Text SECOND if available
        if (section.title) {
          const title = document.createElement('h2');
          title.className = 'section-title';
          title.textContent = section.title;
          header.appendChild(title);
        }

        sectionEl.appendChild(header);

        // Grid rows
        const rows = document.createElement('div');
        rows.className = 'dynamic-rows';
        sectionEl.appendChild(rows);

        for (const rowItems of groupedRows(items)) {
          const rowEl = document.createElement('div');
          rowEl.className = 'dynamic-row';
          rowEl.style.gridTemplateColumns = rowItems.map((item) => itemRatio(item) + 'fr').join(' ');

          for (const item of rowItems) {
            const labelText = String(item.label || '').trim();
            const cell = document.createElement('div');
            cell.className = 'dynamic-cell';
            const ratio = itemRatio(item);

            if (labelText) {
              const label = document.createElement('div');
              label.className = 'dynamic-label';
              label.textContent = labelText;
              cell.appendChild(label);
            }

            const card = document.createElement('figure');
            card.className = 'dynamic-card';
            card.style.setProperty('--ratio', String(ratio));

            const img = document.createElement('img');
            img.loading = 'lazy';
            img.alt = labelText || item.fileName || section.title || '\u0635\u0648\u0631\u0629';
            img.style.opacity = '0';
            img.onerror = () => cell.remove();
            img.addEventListener('load', () => { img.style.opacity = '1'; }, { once: true });
            img.src = item.imageUrl;
            if (img.decode) { img.decode().then(() => { img.style.opacity = '1'; }).catch(() => { }); }

            card.appendChild(img);
            card.addEventListener('click', () => openLightbox(item.imageUrl, labelText || item.fileName || section.title || ''));
            cell.appendChild(card);
            rowEl.appendChild(cell);
          }
          rows.appendChild(rowEl);
        }
        galleryRoot.appendChild(sectionEl);
      }

      const firstSectionEl = renderedSectionEls[0];
      const lastSectionEl = renderedSectionEls[renderedSectionEls.length - 1];

      // Top Background (قبل الأقسام)
      const topBgType = settings.topBgType || 'match';
      const topBgColor = settings.topBgColor || '#0a0a0a';
      if (topBgType === 'custom') {
        document.body.style.background = topBgColor;
      } else if (firstSection) {
        document.body.style.background = computeSectionBgCss(firstSection);
        if (firstSectionEl) firstSectionEl.classList.add('no-top-seam');
      } else {
        document.body.style.background = '#0a0a0a';
      }

      // Footer Background (قسم الواتساب)
      const footerBgType = settings.footerBgType || 'match';
      const footerBgColor = settings.footerBgColor || '';
      const waFooter = document.querySelector('.whatsapp-footer');
      if (waFooter) {
        if (footerBgType === 'custom' && footerBgColor) {
          waFooter.style.background = footerBgColor;
          waFooter.classList.remove('no-line');
        } else if (lastSection) {
          waFooter.style.background = 'transparent';
          waFooter.classList.add('no-line');
          if (lastSectionEl) {
            lastSectionEl.classList.add('no-bottom-seam');
            // Remove bottom padding from the section so it blends smoothly
            lastSectionEl.style.paddingBottom = '0';
            lastSectionEl.appendChild(waFooter);
          }
        } else {
          waFooter.style.background = 'linear-gradient(180deg, transparent 0%, rgba(37, 211, 102, 0.04) 50%, transparent 100%)';
          waFooter.classList.remove('no-line');
        }
      }

      if (!galleryRoot.querySelector('.cinema-section')) setGalleryStatus('\u0644\u0627 \u062a\u0648\u062c\u062f \u0635\u0648\u0631 \u062d\u0627\u0644\u064a\u0627.');
    }

    function openLightbox(url, name) { lbImg.src = url; if (lbName) lbName.textContent = name || ''; backdrop.hidden = false; lb.showModal(); }
    function closeLightbox() { lb.close(); backdrop.hidden = true; lbImg.src = ''; }
    backdrop.addEventListener('click', closeLightbox);
    closeBtn.addEventListener('click', closeLightbox);
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && lb.open) closeLightbox(); });

    const pwaPrompt = document.getElementById('pwaPrompt');
    const pwaInstallBtn = document.getElementById('pwaInstallBtn');
    const pwaCloseBtn = document.getElementById('pwaCloseBtn');
    let deferredPrompt;

    // PWA Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }

    // Handle Install Prompt
    window.addEventListener('beforeinstallprompt', (e) => {
      // Prevent the mini-infobar from appearing on mobile
      e.preventDefault();
      // Stash the event so it can be triggered later
      deferredPrompt = e;
      
      // Check if user already dismissed it in this session
      if (!sessionStorage.getItem('pwaPromptDismissed')) {
        // Show our beautiful prompt after a slight delay
        setTimeout(() => {
          pwaPrompt.classList.add('show');
        }, 3000);
      }
    });

    pwaInstallBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      // Hide the prompt
      pwaPrompt.classList.remove('show');
      // Show the install prompt
      deferredPrompt.prompt();
      // Wait for the user to respond to the prompt
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        sessionStorage.setItem('pwaPromptDismissed', 'true');
      }
      deferredPrompt = null;
    });

    pwaCloseBtn.addEventListener('click', () => {
      pwaPrompt.classList.remove('show');
      sessionStorage.setItem('pwaPromptDismissed', 'true');
    });

    // App installed event handler
    window.addEventListener('appinstalled', () => {
      pwaPrompt.classList.remove('show');
      deferredPrompt = null;
      console.log('PWA was installed');
    });

    (async function bootGallery() {
      try {
        const res = await fetch(GALLERY_API_BASE + '/gallery', { cache: 'no-store' });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || ('gallery ' + res.status));
        
        // Render the DOM elements (they will be hidden behind the loader)
        renderGallery(data.gallery || {});
        
        // Wait for all images to fully download and decode
        const images = Array.from(document.querySelectorAll('.gallery-root img'));
        const imagePromises = images.map(img => {
          if (img.complete) return Promise.resolve();
          return new Promise(resolve => {
            img.addEventListener('load', resolve);
            img.addEventListener('error', resolve);
          });
        });
        
        await Promise.all(imagePromises);

        // Hide the loader instantly
        const loaderOverlay = document.querySelector('.global-loader-overlay');
        if (loaderOverlay) loaderOverlay.classList.add('hidden');
      } catch (error) {
        console.warn('gallery_unavailable', error);
        setGalleryStatus('\u062a\u0639\u0630\u0631 \u062a\u062d\u0645\u064a\u0644 \u0627\u0644\u0623\u0642\u0633\u0627\u0645.');
        // Also hide loader if there's an error so user sees the message
        const loaderOverlay = document.querySelector('.global-loader-overlay');
        if (loaderOverlay) loaderOverlay.classList.add('hidden');
      }
    })();
  </script>

  <!-- Image drag protection -->
  <script>
    document.addEventListener('dragstart', (e) => {
      const t = e.target;
      if (t && t.tagName === 'IMG') e.preventDefault();
    }, true);

    const disableImgDrag = () => {
      for (const img of document.images) img.setAttribute('draggable', 'false');
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', disableImgDrag);
    else disableImgDrag();
    new MutationObserver(disableImgDrag).observe(document.documentElement, { childList: true, subtree: true });
  </script>

  <!-- Anti-screenshot overlay -->
  <div id="anti-ss" aria-hidden="true"
    style="position:fixed;inset:0;opacity:0;pointer-events:none;z-index:-1;transition:opacity .18s ease;"></div>
  <script>
    window.__antiSSShow = () => { };
    window.__antiSSHide = () => { };
  </script>
  <script>
    (function () {
      if (!('ontouchstart' in window)) return;
      const isPhone = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
      if (!isPhone) return;

      let startTouches = null;
      let swiped = false;

      const start = (e) => {
        if (e.touches.length === 3) {
          startTouches = Array.from(e.touches).map(t => ({ x: t.clientX, y: t.clientY }));
          swiped = false;
        } else {
          startTouches = null;
        }
      };
      const move = (e) => {
        if (!startTouches || e.touches.length !== 3) return;
        const cur = Array.from(e.touches).map(t => ({ x: t.clientX, y: t.clientY }));
        let maxDelta = 0;
        for (let i = 0; i < 3; i++) {
          const dx = (cur[i]?.x || 0) - (startTouches[i]?.x || 0);
          const dy = (cur[i]?.y || 0) - (startTouches[i]?.y || 0);
          const d = Math.hypot(dx, dy);
          if (d > maxDelta) maxDelta = d;
        }
        if (maxDelta > 30 && !swiped) {
          swiped = true;
          try {
            if (window.__antiSSShow) window.__antiSSShow(1000);
            else {
              const overlay = document.getElementById('anti-ss');
              if (overlay) {
                overlay.style.opacity = '1';
                overlay.style.pointerEvents = 'auto';
                document.documentElement.classList.add('anti-ss-on');
                setTimeout(() => {
                  overlay.style.opacity = '0';
                  overlay.style.pointerEvents = 'none';
                  document.documentElement.classList.remove('anti-ss-on');
                }, 1000);
              }
            }
          } catch (_) { }
          if (e.cancelable) e.preventDefault();
        }
      };
      const end = () => { startTouches = null; swiped = false; };

      document.addEventListener('touchstart', start, { passive: false });
      document.addEventListener('touchmove', move, { passive: false });
      document.addEventListener('touchend', end, { passive: true });
      document.addEventListener('touchcancel', end, { passive: true });
    })();
  </script>

  <!-- Context menu / devtools block -->
  <script>
    (() => {
      const block = (event) => {
        if (event && event.cancelable) event.preventDefault();
        return false;
      };

      document.addEventListener('contextmenu', block, true);
      document.addEventListener('keydown', (event) => {
        const key = String(event.key || '').toLowerCase();
        const code = String(event.code || '').toLowerCase();
        const ctrlOrMeta = event.ctrlKey || event.metaKey;
        const isF12 = key === 'f12' || code === 'f12';
        const isDevToolsCombo =
          ctrlOrMeta && event.shiftKey && ['i', 'j', 'c'].includes(key);
        const isViewSource = ctrlOrMeta && key === 'u';
        const isSavePage = ctrlOrMeta && key === 's';

        if (isF12 || isDevToolsCombo || isViewSource || isSavePage) {
          block(event);
        }
      }, true);
    })();
  </script>

  <!-- Copy link toast -->
  <script>
    function copyLink() {
      navigator.clipboard.writeText(window.location.href).then(() => {
        const t = document.createElement('div');
        t.textContent = 'تم نسخ رابط الموقع';
        t.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--brand);color:#fff;padding:12px 24px;border-radius:999px;font-size:15px;font-weight:700;z-index:9999;box-shadow:0 8px 30px rgba(230,48,48,.4)';
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 2200);
      });
    }
  </script>
